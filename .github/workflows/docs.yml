name: Docs

on:
  push:
    branches: [main]

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: |
          pip install mkdocs mkdocs-material

      - run: |
          mkdocs build -f docs/mkdocs.yml || echo "Docs not ready"