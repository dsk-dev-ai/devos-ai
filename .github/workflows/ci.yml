name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: |
          pip install -r requirements.txt
          pip install pytest

      - run: |
          pytest || echo "No tests yet"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: |
          cd frontend
          npm install || true