name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write  

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        uses: :contentReference[oaicite:0]{index=0}@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   
